name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eum_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d eum_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      ENV: test
      PYTHONPATH: ${{ github.workspace }}/fastapi
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/eum_dev
      OPENAI_API_KEY: test
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Lint
        working-directory: fastapi
        run: python -m ruff check app --select E9,F63,F7,F82

      - name: Compile
        working-directory: fastapi
        run: python -m compileall app

      - name: Unit tests
        working-directory: fastapi
        run: |
          if [ -d tests ]; then
            python -m pytest tests
          elif [ -d ../tests ]; then
            python -m pytest ../tests
          else
            echo "No tests directory found; skipping pytest."
          fi

      - name: App smoke test
        working-directory: fastapi
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              response = client.get("/health")
              assert response.status_code == 200
          PY

      - name: Docker build
        run: docker build -t eum-ai-fastapi:ci .
